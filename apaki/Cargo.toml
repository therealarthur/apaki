[package]
name = "myrlin-apaki"
version = "1.0.0"
edition = "2021"
description = "Myrlin Apaki: a desktop home for every Claude Code session on this PC, linked to Myrlin Glass."
publish = false

[[bin]]
name = "myrlin-apaki"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
# Self-update from GitHub Releases (src/updater.rs, 2026-10-13): the feed, the signature check, the installer.
tauri-plugin-updater = "2"
# tokio's timer for the update loop (Tauri's async runtime is tokio already; this only turns on its time feature).
tokio = { version = "1", features = ["time"] }
# HMAC-SHA256 for the engine host's handshake (src/host.rs). Same crate and
# version Tauri already builds with (in Cargo.lock), nothing new downloaded.
sha2 = "0.10"

# The built-in browser (src/browser.rs) drives a bare WebView2 controller in
# Apaki's own WebView2 environment. These are the same crates and versions
# Tauri already builds on Windows (nothing new is downloaded or bundled).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# The built-in browser on macOS (src/browser_mac.rs, 2026-10-13): one WKWebView per tab, made here and driven by a small
# injected JS bridge (WKWebView has no DevTools protocol). These are the crates and versions Tauri's own webview (wry)
# already builds on macOS (Cargo.lock), so nothing new is downloaded.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"

[features]
# Every plain `cargo build` is a production build that serves ui/ from the
# embedded assets (same setup as Myrlin Glass).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
codegen-units = 8
