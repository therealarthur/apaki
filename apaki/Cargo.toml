[package]
name = "myrlin-apaki"
version = "0.1.0"
edition = "2021"
description = "Myrlin Apaki: a desktop home for every Claude Code session on this PC, linked to Myrlin Glass."
publish = false

[[bin]]
name = "myrlin-apaki"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
# HMAC-SHA256 for the engine host's handshake (src/host.rs). Same crate and
# version Tauri already builds with (in Cargo.lock), nothing new downloaded.
sha2 = "0.10"

# The built-in browser (src/browser.rs) drives a bare WebView2 controller in
# Apaki's own WebView2 environment. These are the same crates and versions
# Tauri already builds on Windows (nothing new is downloaded or bundled).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[features]
# Every plain `cargo build` is a production build that serves ui/ from the
# embedded assets (same setup as Myrlin Glass).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
codegen-units = 8
