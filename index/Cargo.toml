[package]
name = "latch-index"
version = "0.1.0"
edition = "2021"
description = "Incremental full-text index over every Claude Code transcript on this machine, for latch's session search."
publish = false

[dependencies]
anyhow = "1"
memchr = "2"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.26"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
